<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Care Plan Tracker</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@400;600;700&display=swap');
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:'DM Sans',sans-serif; background:#f5f7fa; min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px; }

  .btn { display:block; padding:18px 24px; border-radius:12px; font-family:'DM Sans',sans-serif; font-size:15px; font-weight:700; color:#fff; text-decoration:none; margin-bottom:14px; transition:opacity .15s; line-height:1.4; }
  .btn:hover { opacity:.88; }
  .btn small { display:block; font-weight:400; font-size:12px; opacity:.85; margin-top:3px; }
  .btn-conv  { background:#1a6fa8; }
  .btn-week  { background:#1b4f72; }

</head>

<div class="card">
  <h1>🏥 Care Plan Tracker</h1>
